<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<script src="tiptap-bundle.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    color: var(--text-color, rgba(0, 0, 0, 0.9));
    background: var(--content-bg, #ffffff);
    -webkit-text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    body { color: var(--text-color, #FFFFFF); background: var(--content-bg, #000000); }
  }

  #editor {
    outline: none;
    min-height: 100vh;
    padding: 0 24px;
    font-size: 16px;
    line-height: calc(1em + 8px);
    color: var(--text-color, inherit);
    background: var(--content-bg, transparent);
  }
  /* 禁用 TipTap 聚焦时的黄色/蓝色 outline */
  #editor:focus, .ProseMirror:focus, .ProseMirror-focused {
    outline: none !important;
    box-shadow: none !important;
  }
  #editor:first-child { padding-top: 16px; }

  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: rgba(0,0,0,0.15);
    float: left; height: 0; pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .ProseMirror p.is-editor-empty:first-child::before { color: rgba(255,255,255,0.15); }
  }

  .ProseMirror h1 { font-size: 24px; font-weight: 650; line-height: 1.1; margin: 0.5em 0 0; }
  .ProseMirror h2 { font-size: 20px; font-weight: 650; line-height: 1.1; margin: 0.4em 0 0; }
  .ProseMirror h3 { font-size: 17px; font-weight: 650; line-height: 1.1; margin: 0.3em 0 0; }
  .ProseMirror p { margin: 0; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; margin: 0.2em 0; }
  .ProseMirror li { margin: 0.1em 0; }
  .ProseMirror blockquote {
    border-left: 3px solid rgba(0,0,0,0.12);
    padding-left: 1em; margin: 0.2em 0; color: rgba(0,0,0,0.6);
  }
  @media (prefers-color-scheme: dark) {
    .ProseMirror blockquote { border-left-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }
  }
  .ProseMirror code {
    background: rgba(0,0,0,0.06); padding: 0.2em 0.4em; border-radius: 3px;
    font-family: monospace; font-size: 0.9em;
  }
  @media (prefers-color-scheme: dark) { .ProseMirror code { background: rgba(255,255,255,0.1); } }
  .ProseMirror pre {
    background: rgba(0,0,0,0.04); padding: 0.8em; border-radius: 6px; overflow-x: auto; margin: 0.2em 0;
  }
  @media (prefers-color-scheme: dark) { .ProseMirror pre { background: rgba(255,255,255,0.06); } }
  .ProseMirror pre code { background: none; padding: 0; }
  .ProseMirror hr { border: none; border-top: 1px solid rgba(0,0,0,0.12); margin: 1em 0; }
  @media (prefers-color-scheme: dark) { .ProseMirror hr { border-top-color: rgba(255,255,255,0.15); } }
  .ProseMirror a { color: #1A73E8; text-decoration: underline; }
  .ProseMirror strong, .ProseMirror b { font-weight: 750; }
  .ProseMirror em { font-style: italic; }
  .ProseMirror s { text-decoration: line-through; }
  .ProseMirror u { text-decoration: underline; }

  /* 有色实线下划线 */
  .ProseMirror .underline_solid_color_default { text-decoration-line: underline; }
  .ProseMirror .underline_solid_color_blue { text-decoration-line: underline; text-decoration-color: var(--blueColor); }
  .ProseMirror .underline_solid_color_red { text-decoration-line: underline; text-decoration-color: var(--redColor); }
  .ProseMirror .underline_solid_color_green { text-decoration-line: underline; text-decoration-color: var(--greenColor); }
  .ProseMirror .underline_solid_color_orange { text-decoration-line: underline; text-decoration-color: var(--orangeColor); }
  .ProseMirror .underline_solid_color_yellow { text-decoration-line: underline; text-decoration-color: var(--yellowColor); }
  .ProseMirror .underline_solid_color_gray { text-decoration-line: underline; text-decoration-color: var(--grayColor); }

  /* 有色波浪下划线：标准 wavy text-decoration（跨节点自动连续） */
  .ProseMirror .underline_wavy_color_default,
  .ProseMirror .underline_wavy_color_blue,
  .ProseMirror .underline_wavy_color_red,
  .ProseMirror .underline_wavy_color_green,
  .ProseMirror .underline_wavy_color_orange,
  .ProseMirror .underline_wavy_color_yellow,
  .ProseMirror .underline_wavy_color_gray {
    text-decoration-line: underline;
    text-decoration-style: wavy;
  }
  .ProseMirror .underline_wavy_color_default { text-decoration-color: currentColor; }
  .ProseMirror .underline_wavy_color_blue { text-decoration-color: var(--blueColor); }
  .ProseMirror .underline_wavy_color_red { text-decoration-color: var(--redColor); }
  .ProseMirror .underline_wavy_color_green { text-decoration-color: var(--greenColor); }
  .ProseMirror .underline_wavy_color_orange { text-decoration-color: var(--orangeColor); }
  .ProseMirror .underline_wavy_color_yellow { text-decoration-color: var(--yellowColor); }
  .ProseMirror .underline_wavy_color_gray { text-decoration-color: var(--grayColor); }

  /* 高亮背景 */
  .ProseMirror .highlight_yellow { background-color: rgba(247,198,0,0.3); }
  .ProseMirror .highlight_red { background-color: rgba(255,173,190,0.3); }
  .ProseMirror .highlight_blue { background-color: rgba(85,184,241,0.3); }
  .ProseMirror .highlight_green { background-color: rgba(104,209,121,0.3); }

  .ProseMirror table { border-collapse: collapse; }
  .ProseMirror td, .ProseMirror th { border: 1px solid rgba(0,0,0,0.12); padding: 8px 12px; }

  .ProseMirror img {
    max-width: 100%; height: auto;
    border-radius: 4px; margin: 0.5em 0; display: block;
  }
  .ProseMirror img.ProseMirror-selectednode {
    outline: 2px solid #1A73E8;
  }
</style>
</head>
<body>
<div id="editor"></div>
<script src="editor-core.js"></script>
</body>
</html>
